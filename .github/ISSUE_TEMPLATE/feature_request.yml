name: Feature request
description: Propose an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What real situation is not handled well today? Concrete beats abstract.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: reliability
    attributes:
      label: Reliability impact
      description: The project's governing value is that a message must never be silently missed. How does this proposal interact with that? "No interaction" is a fine answer.
